# 一時的な調査用ワークフロー。**確認が済んだらこのファイルごと削除すること。**
#
# 目的はただ一つ、GitHub が実際に発行する OIDC トークンの `sub` を目で見ることである。
# 2026-07-15 に既定の subject claim 形式が immutable 形式
# (`repo:OWNER@OWNER-ID/REPO@REPO-ID:...`) に変わったが、
# `gh api repos/shutx-net/blog/actions/oidc/customization/sub` は
# `use_immutable_subject: false` を返しつつ `sub_claim_prefix` には immutable 形式を返す。
# ドキュメントだけでは「作成日がカットオフ後なので既定で immutable」とも
# 「オプトインしていないので legacy」とも読めてしまう。**読み間違えると初回デプロイの
# assume が必ず落ちる**ので、IAM の信頼ポリシーを deploy する前に実測する。
#
# `sub` のプレフィックスは **どの ref で走らせても同じ**（違うのは末尾の ref 部分だけ）なので、
# main にマージする前の作業ブランチで `workflow_dispatch` から 1 回回せば足りる。
#
# **AWS には一切触れない。** 資格情報も要らず、ロールも assume しない。
name: OIDC probe (temporary)

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # id-token: write だけ。checkout もしないので contents すら要らない。
    # 指定しなかった権限はすべて none になる。
    permissions:
      id-token: write
    steps:
      # `environment:` を付けないこと。付けると sub が `...:environment:<name>` になり、
      # ここで測った値が deploy.yml の実際の sub と食い違う。
      - name: Print only the sub and aud claims
        run: |
          set -euo pipefail

          # ACTIONS_ID_TOKEN_REQUEST_* はランナーが id-token: write のときだけ入れる。
          # GitHub の式を一切埋め込まないので、スクリプトインジェクションの経路が無い。
          token="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')"

          # **トークン本体を絶対にログへ出さないこと。** public リポジトリのログは誰でも読める。
          # 取得した直後にマスク登録して、以降うっかり出力しても伏せられるようにする。
          echo "::add-mask::$token"

          test -n "$token" && test "$token" != 'null'

          # JWT の 2 番目のセグメントがペイロード。base64url なので base64 に直し、
          # 長さを 4 の倍数に詰めてからデコードする。署名部には触れない。
          payload="$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')"
          while [ "$(( ${#payload} % 4 ))" -ne 0 ]; do payload="${payload}="; done

          # 出すのは sub と aud だけ。他のクレーム（actor など）は用が無い。
          printf '%s' "$payload" | base64 -d \
            | jq -r '"sub = \(.sub)\naud = \(.aud)"'
